name: Sideload APK

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  sideload-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Assemble release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Name phone APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/dkmzv-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/dkmzv-app-armv7.apk
          ls -lh dist

      - name: Upload arm64 APK (phones)
        uses: actions/upload-artifact@v4
        with:
          name: dkmzv-app-arm64
          path: dist/dkmzv-app-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armv7 APK (older phones)
        uses: actions/upload-artifact@v4
        with:
          name: dkmzv-app-armv7
          path: dist/dkmzv-app-armv7.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish sideload release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3-sideload
          name: DKMZV v3 sideload
          prerelease: true
          make_latest: false
          files: dist/dkmzv-app-arm64.apk
          body: |
            Parish sideload APK for **64-bit Android phones** (`arm64-v8a`).
            Release-minified, one ABI — typically ~15–25 MB instead of the 149 MB debug fat APK.

            Direct file: the `dkmzv-app-arm64.apk` asset on this release.

            Older 32-bit phones: download `dkmzv-app-armv7` from the workflow Artifacts.

            Debug-signed (not a Play upload key). Demo PIN `dkmzv`. Seed paybill/phones are placeholders.

      - name: Comment download URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const releaseUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/releases/tag/v3-sideload`;
            const body = [
              '**Smaller sideload APK** (release, arm64 only — not the 149 MB debug fat file).',
              '',
              `This run: ${runUrl} → Artifacts → \`dkmzv-app-arm64\``,
              `Stable link after merge/push: ${releaseUrl} → \`dkmzv-app-arm64.apk\``,
              '',
              'Use **arm64** on current phones. Use \`dkmzv-app-armv7\` only on old 32-bit devices.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '**Smaller sideload APK**';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
