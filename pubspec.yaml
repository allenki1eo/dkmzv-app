name: dkmzv_app
description: Member companion for KKKT DKMZV (Lutheran, Shinyanga). Android-first, Swahili + English, offline hymns.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  webview_flutter: ^4.13.0
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/church.json
    - assets/brand/dkmzv-splash.png
    - assets/brand/dkmzv-icon-master-1024.png
    - assets/brand/dkmzv-playstore-512.png
    - assets/brand/dkmzv-logo-official-source.png
